<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talk2</title>
<style>
  :root {
    --bg: #14161a; --card: #1c1f25; --text: #eef0f3; --muted: #9aa3ae;
    --accent: #e8a35a; --line: #2b3038; --done: #6b7380;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 22px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 28px 32px 40px; max-width: 900px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
           border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; }
  h1#title { font-size: 1.45em; margin: 0; letter-spacing: -0.01em; }
  #time { color: var(--muted); font-size: 0.75em; white-space: nowrap; }
  #content h1, #content h2, #content h3 { margin: 1.1em 0 0.4em; line-height: 1.25; }
  #content h1 { font-size: 1.3em; } #content h2 { font-size: 1.15em; } #content h3 { font-size: 1em; color: var(--accent); }
  #content p { margin: 0.5em 0; }
  #content ul, #content ol { padding-left: 1.3em; margin: 0.4em 0; }
  #content li { margin: 0.35em 0; }
  #content li::marker { color: var(--accent); }
  #content li.task { list-style: none; margin-left: -1.3em; display: flex; gap: 12px; align-items: flex-start;
                     cursor: pointer; padding: 6px 10px; border-radius: 10px; }
  #content li.task:hover { background: var(--card); }
  #content li.task .box { flex: none; width: 1.05em; height: 1.05em; margin-top: 0.22em; border-radius: 6px;
                          border: 2px solid var(--accent); display: grid; place-items: center; font-size: 0.8em; }
  #content li.task.done { color: var(--done); text-decoration: line-through; }
  #content li.task.done .box { background: var(--accent); color: var(--bg); }
  #content code { background: var(--card); padding: 0.1em 0.35em; border-radius: 6px; font-size: 0.9em; }
  #content pre { background: var(--card); padding: 14px 16px; border-radius: 10px; overflow-x: auto; font-size: 0.8em; }
  #content pre code { background: none; padding: 0; }
  #content a { color: var(--accent); }
  #content strong { color: #fff; }
  #content hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  #content table { border-collapse: collapse; margin: 0.6em 0; font-size: 0.9em; }
  #content th, #content td { border-bottom: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  #empty { color: var(--muted); text-align: center; margin-top: 30vh; }
  #status { position: fixed; bottom: 10px; right: 14px; color: var(--muted); font-size: 0.6em; }
</style>
</head>
<body>
<header><h1 id="title">talk2</h1><span id="time"></span></header>
<div id="content"></div>
<div id="empty" hidden>Ask for a list and it shows up here.</div>
<div id="status"></div>
<script>
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function render(md) {
  const lines = md.replace(/\r/g, "").split("\n");
  let html = "", list = null, para = [], i = 0;
  const flushPara = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (/^```/.test(line)) {
      flushPara(); closeList();
      const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; i++; continue;
    }
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushPara(); closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if (/^\s*(---|\*\*\*)\s*$/.test(line)) { flushPara(); closeList(); html += "<hr>"; }
    else if ((m = line.match(/^\s*\|(.+)\|\s*$/))) {
      flushPara(); closeList();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      html += "<table>" + body.map((r, k) => "<tr>" + cells(r).map((c) => k ? `<td>${c}</td>` : `<th>${c}</th>`).join("") + "</tr>").join("") + "</table>";
      continue;
    }
    else if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(\[( |x|X)\]\s+)?(.*)/))) {
      flushPara();
      const want = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== want) { closeList(); html += `<${want}>`; list = want; }
      if (m[2]) {
        const done = m[3].toLowerCase() === "x";
        html += `<li class="task${done ? " done" : ""}"><span class="box">${done ? "✓" : ""}</span><span>${inline(m[4])}</span></li>`;
      } else html += `<li>${inline(m[4])}</li>`;
    }
    else if (!line.trim()) { flushPara(); closeList(); }
    else { closeList(); para.push(line.trim()); }
    i++;
  }
  flushPara(); closeList();
  return html;
}
const $ = (id) => document.getElementById(id);
document.addEventListener("click", (e) => {
  const li = e.target.closest("li.task");
  if (!li) return;
  li.classList.toggle("done");
  li.querySelector(".box").textContent = li.classList.contains("done") ? "✓" : "";
});
function show(c) {
  if (!c.visible && c.markdown) { try { window.close(); } catch (e) {} }
  $("title").textContent = c.title || "talk2";
  document.title = c.title ? `${c.title} · talk2` : "talk2";
  $("time").textContent = c.time || "";
  $("content").innerHTML = c.visible ? render(c.markdown || "") : "";
  $("empty").hidden = !!(c.visible && c.markdown);
  window.scrollTo(0, 0);
}
function connect() {
  const es = new EventSource("/panel/events");
  es.onopen = () => { $("status").textContent = ""; };
  es.onmessage = (e) => show(JSON.parse(e.data));
  es.onerror = () => { $("status").textContent = "reconnecting…"; };
}
connect();
</script>
</body>
</html>
